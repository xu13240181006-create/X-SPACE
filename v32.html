function parse(a){return a.map(x=>({date:x[0],price:x[1],sentiment:x[2],vix:nz(x[3]),yc:nz(x[4]),nfci:nz(x[5]),sahm:nz(x[6])}));}

// 宏观评分：数据已在构建脚本里按周做时点对齐（无前视），这里直接读当行的值
// 满分3，<2 拦截。YC<0 扣1；NFCI>0 扣1、-0.3~0 扣0.5；Sahm≥0.5 扣1、0.3~0.5 扣0.5；缺数据不扣分
function getEcon(d){
  const yc=nz(d.yc),nf=nz(d.nfci),sa=nz(d.sahm);
  let score=3;const flags=[];
  if(yc!==null&&yc<0){score-=1;flags.push("倒挂");}
  if(nf!==null){if(nf>0){score-=1;flags.push("金融紧");}else if(nf>-0.3){score-=0.5;flags.push("金融偏紧");}}
  if(sa!==null){if(sa>=0.5){score-=1;flags.push("衰退");}else if(sa>=0.3){score-=0.5;flags.push("就业转弱");}}
  return{yc,nfci:nf,sahm:sa,score:Math.max(0,score),flags};
}
function trigOK(d,p){return p.trig==='vix'?(d.vix!==null&&d.vix!==undefined&&d.vix>=p.vix):(d.sentiment<=p.sent);}
function futureRets(data,i){const f={};HORIZONS.forEach(([w,l])=>{f[l]=i+w<data.length?Math.round((data[i+w].price-data[i].price)/data[i].price*1000)/10:null;});return f;}
function calcDD(data){for(let i=0;i<data.length;i++){const start=Math.max(0,i-52);let hi=0;for(let j=start;j<=i;j++)hi=Math.max(hi,data[j].price);data[i].dd=(data[i].price-hi)/hi*100;}}
// 基准：同一段数据里「任意一周买入」的胜率/平均收益，用来判断信号有没有超额
function baselineStats(data,periods,start){const out={};periods.forEach(p=>{const h=HORIZONS.find(x=>x[1]===p);const w=h?h[0]:0;let n=0,wins=0,sum=0;for(let i=start;i+w<data.length;i++){const r=(data[i+w].price-data[i].price)/data[i].price*100;n++;if(r>0)wins++;sum+=r;}out[p]={wr:n?Math.round(wins/n*100):0,avg:n?Math.round(sum/n*10)/10:0};});return out;}
function segLine(arr,key){const r=arr.map(s=>s.future[key]).filter(x=>x!==null&&x!==undefined);if(!r.length)return'无';const w=r.filter(x=>x>0).length;const a=Math.round(r.reduce((x,y)=>x+y,0)/r.length*10)/10;return r.length+'次 · 胜率'+Math.round(w/r.length*100)+'% · 均'+(a>=0?'+':'')+a+'%';}
function baseCell(b){return '<div style="font-size:8px;color:rgba(255,255,255,0.28);margin-top:4px">任意周 '+b.wr+'% / '+(b.avg>=0?'+':'')+b.avg+'%</div>';}

function addMA(data,period){
  for(let i=0;i<data.length;i++){
    if(i<period-1)data[i].ma=data[i].price;
    else{let s=0;for(let j=i-period+1;j<=i;j++)s+=data[j].price;data[i].ma=s/period;}
    data[i].bull=data[i].price>=data[i].ma;
    let rb=false;for(let j=0;j<Math.min(13,i+1);j++)if(data[i-j]&&data[i-j].bull)rb=true;
    data[i].recentBull=rb;
  }
}

function computeSentiment(data,lookback=10){
  const n=data.length;
  for(let i=Math.max(0,n-5);i<n;i++){
    if(i<lookback){data[i].sentiment=50;continue;}
    const mom=(data[i].price-data[i-lookback].price)/data[i-lookback].price;
    let volSum=0;for(let j=i-lookback+1;j<=i;j++){const r=(data[j].price-data[j-1].price)/data[j-1].price;volSum+=r*r;}
    const vol=Math.sqrt(volSum/lookback);
    let momRank=0,volRank=0,cnt=0;
    for(let j=lookback;j<=i;j++){
      const m2=(data[j].price-data[j-lookback].price)/data[j-lookback].price;
      let v2=0;for(let k=j-lookback+1;k<=j;k++){const r2=(data[k].price-data[k-1].price)/data[k-1].price;v2+=r2*r2;}v2=Math.sqrt(v2/lookback);
      if(m2<mom)momRank++;if(v2<vol)volRank++;cnt++;
    }
    if(cnt>0){const mp=momRank/cnt*100,vp=100-volRank/cnt*100;data[i].sentiment=Math.max(0,Math.min(100,Math.round(mp*0.6+vp*0.4)));}
    else data[i].sentiment=50;
  }
}

function recalcSentiment(data,lookback=10){
  // Find where new data starts (sentinel sentiment=50 after lookback period)
  var startIdx=data.length;
  for(var i=data.length-1;i>=lookback;i--){
    if(data[i].sentiment===50)startIdx=i;
    else break;
  }
  if(startIdx>=data.length)return; // nothing to recalculate
  // Recalculate from startIdx
  for(var i=startIdx;i<data.length;i++){
    if(i<lookback){data[i].sentiment=50;continue;}
    var mom=(data[i].price-data[i-lookback].price)/data[i-lookback].price;
    var volSum=0;for(var j=i-lookback+1;j<=i;j++){var r=(data[j].price-data[j-1].price)/data[j-1].price;volSum+=r*r;}
    var vol=Math.sqrt(volSum/lookback);
    var momRank=0,volRank=0,cnt=0;
    for(var j=lookback;j<=i;j++){
      var m2=(data[j].price-data[j-lookback].price)/data[j-lookback].price;
      var v2=0;for(var k=j-lookback+1;k<=j;k++){var r2=(data[k].price-data[k-1].price)/data[k-1].price;v2+=r2*r2;}v2=Math.sqrt(v2/lookback);
      if(m2<mom)momRank++;if(v2<vol)volRank++;cnt++;
    }
    if(cnt>0){var mp=momRank/cnt*100,vp=100-volRank/cnt*100;data[i].sentiment=Math.max(0,Math.min(100,Math.round(mp*0.6+vp*0.4)));}
    else data[i].sentiment=50;
  }
}

function calcWeeklyRSI(data, period=14){
  // 周线 RSI，Wilder 平滑（与 TradingView 口径一致）：前 period 周简单平均做种子，之后递推
  let ag=0,al=0;
  for(let i=0;i<data.length;i++){
    if(i===0){data[i].rsi=50;continue;}
    const c=data[i].price-data[i-1].price,g=c>0?c:0,l=c<0?-c:0;
    if(i<=period){
      ag+=g;al+=l;
      if(i<period){data[i].rsi=50;continue;}
      ag/=period;al/=period;
    }else{
      ag=(ag*(period-1)+g)/period;al=(al*(period-1)+l)/period;
    }
    data[i].rsi=al===0?100:Math.round(100-100/(1+ag/al));
  }
}

function calcAhr999(data){
  // ahr999 = (price / 200-day geometric mean) * (price / log regression estimate)
  // For weekly data: 200 days ≈ 29 weeks
  const gmaWeeks=29;
  for(let i=0;i<data.length;i++){
    if(i<gmaWeeks){data[i].ahr999=null;continue;}
    // Geometric mean of last 29 weeks
    let logSum=0;
    for(let j=i-gmaWeeks+1;j<=i;j++)logSum+=Math.log(data[j].price);
    const gma=Math.exp(logSum/gmaWeeks);
    // Log regression estimate: price = 10^(a * log10(days) + b)
    // Fitted params (approximate from BTC history since 2009)
    const daysSinceGenesis=Math.round((new Date(data[i].date)-BTC_GENESIS)/86400000);
    if(daysSinceGenesis<=0){data[i].ahr999=null;continue;}
    const logDays=Math.log10(daysSinceGenesis);
    const estimatedPrice=Math.pow(10, 5.84 * logDays - 17.01);
    // ahr999 = (price/gma) * (price/estimated)
    const ahr=(data[i].price/gma)*(data[i].price/estimatedPrice);
    data[i].ahr999=Math.round(ahr*100)/100;
  }
}

function addMA200w(data){
  // 不足 200 周时记为 null（无法判断），不再自动放行
  for(let i=0;i<data.length;i++){
    if(i<199){data[i].ma200w=null;data[i].nearMA200w=null;continue;}
    let s=0;for(let j=i-199;j<=i;j++)s+=data[j].price;data[i].ma200w=s/200;
    data[i].nearMA200w=data[i].price<=data[i].ma200w*1.2;
  }
}

// ════════════════════════════════════════
// SIGNAL FINDING — branched by asset type
// ════════════════════════════════════════
function findSignals_stock(data,p){
  calcDD(data);
  const signals=[],filtered=[];let last=-p.cool-1;
  for(let i=10;i<data.length;i++){const d=data[i];
    if(trigOK(d,p)&&d.dd<=-p.dd&&(i-last)>p.cool){
      const future=futureRets(data,i);
      const ec=getEcon(d);
      const sig={idx:i,date:d.date,price:d.price,sent:d.sentiment,vix:d.vix,dd:Math.round(d.dd*10)/10,bull:d.bull,recentBull:d.recentBull,econ:ec.score,flags:ec.flags,yc:ec.yc,nfci:ec.nfci,sahm:ec.sahm,future};
      let reject=false,reasons=[],blockedLayers=[];
      if(p.useMA&&!d.recentBull){reject=true;reasons.push("深熊");blockedLayers.push("均线");}
      if(p.useEcon&&ec.score<2){reject=true;reasons.push(ec.flags.join("+"));blockedLayers.push("经济");}
      // 极端恐慌豁免：VIX≥override 时，过滤层不拦（历史上真底部多出现在 VIX 极端时，熊市初期 VIX 多在 30~35）
      sig.override=false;sig.recov=null;
      if(reject&&ovrOK(d,p)){reject=false;sig.override=true;}
      if(reject&&p.recov){const rv=recovReason(data,i);if(rv){reject=false;sig.recov=rv;}}
      sig.reject=reject;sig.reasons=reasons;sig.blockedLayers=blockedLayers;sig.grade=reject?'B':'A';
      if(reject)filtered.push(sig);else signals.push(sig);last=i;
    }
  }
  return{signals,filtered};
}
function ovrOK(d,p){return p.trig==='vix'&&p.override>0&&d.vix!==null&&d.vix!==undefined&&d.vix>=p.override;}
// 复苏升级：衰退已被确认、并且在好转时，被过滤的信号升级为满仓。m = 取宏观值的那一行（周线行号）
//   失业见顶回落：Sahm≥0.5，且比过去 52 周（约 12 个月）里的最高值低 0.1 以上
//   金融转松：NFCI 比 13 周前下降 0.5 以上
// 历史上被过滤的信号里，亏损的都出现在衰退前或衰退恶化期，赚钱的集中在见顶回落之后
function recovReason(data,m){
  const d=data[m];if(!d)return null;
  const sa=nz(d.sahm),nf=nz(d.nfci);
  if(sa!==null&&sa>=0.5){let pk=sa;for(let k=Math.max(0,m-52);k<m;k++){const v=nz(data[k].sahm);if(v!==null&&v>pk)pk=v;}if(pk-sa>=0.1-1e-9)return '失业见顶回落';}
  if(nf!==null&&m>=13){const b=nz(data[m-13].nfci);if(b!==null&&nf-b<=-0.5+1e-9)return '金融转松';}
  return null;
}

// 日线收盘锁定：指标仍是周线口径，但每个交易日收盘都判定一次（当天价格视作本周收盘）。
// 信号一旦出现，就按当天的日期和收盘价记录下来，之后本周怎么走都不会改写它。
// data = 已 addMA 的周线行；daily = DAILY[asset]。冷却期按周计（被过滤的触发同样启动冷却）。
function useDayLock(p,name){return p.lock!=='week'&&DAILY[name]&&DAILY[name].length>0;}
function findSignals_stock_daily(data,daily,p){
  const W=data.length,N=daily.length,L=10;
  const wkIdx={};for(let w=0;w<W;w++)wkIdx[isoWeekKey(data[w].date)]=w;
  const dw=new Array(N);for(let i=0;i<N;i++){const k=wkIdx[isoWeekKey(dayToDate(daily[i][0]))];dw[i]=k===undefined?-1:k;}
  const wc=data.map(d=>d.price);
  const pre=[0];for(let w=0;w<W;w++)pre.push(pre[w]+wc[w]);
  let mom=null,vol=null;
  if(p.trig!=='vix'){mom=new Array(W).fill(0);vol=new Array(W).fill(0);
    for(let w=L;w<W;w++){mom[w]=(wc[w]-wc[w-L])/wc[w-L];let s=0;for(let j=w-L+1;j<=w;j++){const r=(wc[j]-wc[j-1])/wc[j-1];s+=r*r;}vol[w]=Math.sqrt(s/L);}}
  const signals=[],filtered=[];let lastW=-p.cool-1;
  for(let i=0;i<N;i++){
    const w=dw[i];
    if(w<L+1||w-lastW<=p.cool)continue;
    const px=daily[i][1],vx=daily[i][2];
    let sent=null,trig;
    if(p.trig==='vix'){trig=vx!==null&&vx!==undefined&&vx>=p.vix;}
    else{
      const m=(px-wc[w-L])/wc[w-L];let s=0,prev=wc[w-L];
      for(let j=w-L+1;j<=w;j++){const cur=j===w?px:wc[j];const r=(cur-prev)/prev;s+=r*r;prev=cur;}
      const v=Math.sqrt(s/L);let mr=0,vr=0;
      for(let j=L;j<w;j++){if(mom[j]<m)mr++;if(vol[j]<v)vr++;}
      const cnt=w-L+1;sent=Math.max(0,Math.min(100,Math.round(mr/cnt*100*0.6+(100-vr/cnt*100)*0.4)));
      trig=sent<=p.sent;
    }
    if(!trig)continue;
    let hi=px;for(let j=Math.max(0,w-52);j<w;j++)if(wc[j]>hi)hi=wc[j];
    const dd=(px-hi)/hi*100;
    if(dd>-p.dd)continue;
    const maNow=w<p.ma-1?px:(pre[w]-pre[w-p.ma+1]+px)/p.ma;
    let rb=px>=maNow;for(let j=1;j<Math.min(13,w+1)&&!rb;j++)if(data[w-j].bull)rb=true;
    const isLast=(i===N-1)||dw[i+1]!==w;
    const mi=isLast?w:w-1;                         // 周中用上一周已发布的宏观值，避免前视
    const ec=getEcon(data[mi]);
    const future={};DHORIZ.forEach(([n,l])=>{future[l]=i+n<N?Math.round((daily[i+n][1]-px)/px*1000)/10:null;});
    const sig={idx:w,di:i,date:dayToDate(daily[i][0]),price:px,sent:sent!==null?sent:data[w].sentiment,vix:nz(vx),dd:Math.round(dd*10)/10,recentBull:rb,econ:ec.score,flags:ec.flags,yc:ec.yc,nfci:ec.nfci,sahm:ec.sahm,future,daily:true};
    let reject=false,reasons=[],blockedLayers=[];
    if(p.useMA&&!rb){reject=true;reasons.push("深熊");blockedLayers.push("均线");}
    if(p.useEcon&&ec.score<2){reject=true;reasons.push(ec.flags.join("+"));blockedLayers.push("经济");}
    sig.override=false;sig.recov=null;
    if(reject&&ovrOK({vix:vx},p)){reject=false;sig.override=true;}
    if(reject&&p.recov){const rv=recovReason(data,mi);if(rv){reject=false;sig.recov=rv;}}
    sig.reject=reject;sig.reasons=reasons;sig.blockedLayers=blockedLayers;sig.grade=reject?'B':'A';
    if(reject)filtered.push(sig);else signals.push(sig);lastW=w;
  }
  return{signals,filtered};
}

function findSignals_btc(data,p){
  calcWeeklyRSI(data);calcAhr999(data);addMA200w(data);
  calcDD(data);
  const signals=[],filtered=[];let last=-p.cool-1;
  for(let i=30;i<data.length;i++){const d=data[i];
    if(d.rsi<=p.rsi&&d.dd<=-p.dd&&(i-last)>p.cool){
      const future=futureRets(data,i);
      const sig={idx:i,date:d.date,price:d.price,rsi:d.rsi,dd:Math.round(d.dd*10)/10,
        ahr999:d.ahr999,ma200w:d.ma200w===null?null:Math.round(d.ma200w),nearMA200w:d.nearMA200w,future};
      let reject=false,reasons=[],blockedLayers=[];
      if(p.ma200w&&d.nearMA200w!==true){reject=true;reasons.push(d.nearMA200w===null?"200周线数据不足":"远离200周线");blockedLayers.push("200周线");}
      if(d.ahr999!==null&&d.ahr999>=p.ahr999){reject=true;reasons.push("ahr999="+d.ahr999);blockedLayers.push("ahr999");}
      sig.reject=reject;sig.reasons=reasons;sig.blockedLayers=blockedLayers;
      if(reject)filtered.push(sig);else signals.push(sig);last=i;
    }
  }
  return{signals,filtered};
}

// ════════════════════════════════════════
// LIVE STATUS — branched
// ════════════════════════════════════════
// 把数据切成「已确认的周收盘」和「本周预览」。同一 ISO 周只保留一行：实时价替换本周那一行，不再追加
function splitWeeks(data,livePrice,isCrypto,liveVix){
  const d=data.map(x=>({...x}));
  if(!d.length)return{confirmed:d,preview:null};
  const now=new Date(),wd=now.getUTCDay(),nowKey=isoWeekKey(utcToday());
  // 美股：周五 21:00 UTC 之后到周日算本周已收盘；BTC：本周要到周日 24:00 UTC 才收盘
  const weekOpen=isCrypto?true:!(wd===6||wd===0||(wd===5&&now.getUTCHours()>=21));
  const lastIsCur=isoWeekKey(d[d.length-1].date)===nowKey;
  if(!weekOpen||(!lastIsCur&&!livePrice))return{confirmed:d,preview:null};
  const confirmed=lastIsCur?d.slice(0,-1):d;
  const row={...d[d.length-1],sentiment:50};
  if(livePrice){row.price=livePrice;row.date=utcToday();if(liveVix!==null&&liveVix!==undefined)row.vix=liveVix;}
  return{confirmed,preview:confirmed.map(x=>({...x})).concat([row])};
}

function getStatus_stock(rows,p){
  const d=rows.map(x=>({...x}));
  computeSentiment(d);addMA(d,p.ma);calcDD(d);
  const last=d[d.length-1],dd=last.dd;
  const ec=getEcon(last);
  const isV=p.trig==='vix';
  const trigOk=trigOK(last,p),ddOk=dd<=-p.dd,maOk=!p.useMA||last.recentBull,econOk=!p.useEcon||ec.score>=2;
  const nearTrig=isV?(last.vix!==null&&last.vix>=p.vix-5):(last.sentiment<=p.sent+10);
  let signal='safe',reason='';
  if(trigOk&&ddOk){
    const b=[];if(!maOk)b.push('均线');if(!econOk)b.push('宏观');
    if(!b.length){signal='fire';reason='🔥 信号触发！';}
    else if(ovrOK(last,p)){signal='fire';reason='🔥 信号触发！（VIX≥'+p.override+' 极端恐慌豁免，'+b.join('+')+'未过）';}
    else if(p.recov&&recovReason(d,d.length-1)){signal='fire';reason='🔥 信号触发！（'+recovReason(d,d.length-1)+'，复苏升级；'+b.join('+')+'未过）';}
    else if(p.grade){signal='graded';reason='🟠 仅提示 · 不建议买入（'+b.join('+')+'未过）';}
    else{signal='blocked';reason='⛔ 拦截: '+b.join('+');}
  }
  else if(nearTrig&&dd<=-(p.dd-3)){signal='near';reason='⚠️ 接近触发';}
  else{signal='safe';reason='😴 无信号';}
  return{date:last.date,price:last.price,signal,reason,conds:[
    isV?{name:'VIX',ok:trigOk,val:last.vix!==null?last.vix.toFixed(1):'—',detail:'≥'+p.vix}:{name:'情绪',ok:trigOk,val:last.sentiment,detail:'≤'+p.sent},
    {name:'回撤',ok:ddOk,val:dd.toFixed(1)+'%',detail:'≥'+p.dd+'%'},
    {name:'均线',ok:maOk,val:last.recentBull?'上方':'下方',detail:p.ma+'周'},
    {name:'宏观',ok:econOk,val:ec.score.toFixed(1)+'分',detail:ec.flags.length?ec.flags.join(' '):'健康'}
  ]};
}

function getStatus_btc(rows,p){
  const d=rows.map(x=>({...x}));
  calcWeeklyRSI(d);calcAhr999(d);addMA200w(d);calcDD(d);
  const last=d[d.length-1],dd=last.dd;
  const rsiOk=last.rsi<=p.rsi,ddOk=dd<=-p.dd,maOk=!p.ma200w||last.nearMA200w===true,ahrOk=last.ahr999===null||last.ahr999<p.ahr999;
  let signal='safe',reason='';
  if(rsiOk&&ddOk){if(maOk&&ahrOk){signal='fire';reason='🔥 BTC信号触发！';}else{signal='blocked';const b=[];if(!maOk)b.push('200周线');if(!ahrOk)b.push('ahr999');reason='⛔ 拦截: '+b.join('+');}}
  else if(last.rsi<=p.rsi+10&&dd<=-(p.dd-5)){signal='near';reason='⚠️ 接近触发';}
  else{signal='safe';reason='😴 无信号';}
  return{date:last.date,price:last.price,signal,reason,conds:[
    {name:'周RSI',ok:rsiOk,val:last.rsi,detail:'≤'+p.rsi+' (Wilder)'},
    {name:'回撤',ok:ddOk,val:dd.toFixed(1)+'%',detail:'≥'+p.dd+'%'},
    {name:'200周线',ok:maOk,val:!p.ma200w?'关闭':(last.nearMA200w===null?'数据不足':(last.nearMA200w?'附近':'远离')),detail:last.ma200w?'$'+Math.round(last.ma200w).toLocaleString():'—'},
    {name:'ahr999',ok:ahrOk,val:last.ahr999!==null?last.ahr999.toFixed(2):'—',detail:'<'+p.ahr999}
  ]};
}

let fetchLog=[];
async function tryFetch(url,timeout=8000){

  try{const r=await fetch(url,{signal:ctrl.signal});clearTimeout(timer);if(!r.ok)return null;return await r.json();}

}

let histLastFetch=0;
async function fetchRecentWeekly(){
  const now=Date.now();
  if(now-histLastFetch<3600*1000&&histLastFetch>0)return{updated:0};
  
  let updated=0;
  const proxies=['https://corsproxy.io/?url=','https://api.allorigins.win/raw?url='];
  
  // SPY & QQQ: Yahoo Finance weekly data (last 6 months)
  for(const sym of ['SPY','QQQ']){
    const yfUrl='https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?range=6mo&interval=1wk';
    for(const px of proxies){
      try{
        const ctrl=new AbortController();
        const timer=setTimeout(function(){ctrl.abort();},8000);
        const r=await fetch(px+encodeURIComponent(yfUrl),{signal:ctrl.signal});
        clearTimeout(timer);
        if(!r.ok)continue;
        const j=await r.json();
        if(j&&j.chart&&j.chart.result&&j.chart.result[0]){
          const res=j.chart.result[0];
          const ts=res.timestamp;
          // 优先用复权价，与嵌入数据（EODHD adjusted_close）口径一致
          const adj=res.indicators&&res.indicators.adjclose&&res.indicators.adjclose[0]?res.indicators.adjclose[0].adjclose:null;
          const closes=adj||(res.indicators&&res.indicators.quote&&res.indicators.quote[0]?res.indicators.quote[0].close:null);
          if(ts&&closes&&ts.length===closes.length){
            var merged=mergeWeekly(RAW[sym],ts,closes);
            if(merged>0){updated++;fetchLog.push('✓ '+sym+' +'+merged+'周');}
          }
          break;
        }
      }catch(e){}
    }
  }
  
  // BTC: CoinGecko daily data (last 180 days), convert to weekly
  try{
    var j=await tryFetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=180&interval=daily');
    if(j&&j.prices){
      // 按 ISO 周（UTC）分组，只追加嵌入数据最后一周之后的周，避免同一周出现多行
      var weekMap={};
      j.prices.forEach(function(p){
        var key=new Date(p[0]).toISOString().slice(0,10);
        weekMap[isoWeekKey(key)]={date:key,price:Math.round(p[1]*100)/100};
      });
      var lastKey=RAW.BTC.length>0?isoWeekKey(RAW.BTC[RAW.BTC.length-1][0]):'0000-00';
      var added=0;
      Object.keys(weekMap).sort().forEach(function(wk){
        if(wk>lastKey){
          var w=weekMap[wk];
          RAW.BTC.push([w.date,w.price,50]);
          added++;
        }
      });
      if(added>0){updated++;fetchLog.push('✓ BTC +'+added+'周');}
    }
  }catch(e){}
  
  if(updated>0)histLastFetch=now;
  return{updated:updated};
}

function mergeWeekly(rawArr,timestamps,closes){
  // rawArr: [[date,price,sentiment,(vix,yc,nfci,sahm)],...]
  // 只追加嵌入数据最后一周之后的 ISO 周；宏观列沿用最后一行，下次 Action 运行时会被正式数据替换
  var lastRow=rawArr.length>0?rawArr[rawArr.length-1]:null;
  var lastKey=lastRow?isoWeekKey(lastRow[0]):'0000-00';
  var added=0;
  for(var i=0;i<timestamps.length;i++){
    if(closes[i]===null||closes[i]===undefined)continue;
    var ds=new Date(timestamps[i]*1000).toISOString().slice(0,10);
    var k=isoWeekKey(ds);
    if(k>lastKey){
      var row=[ds,Math.round(closes[i]*100)/100,50];
      if(lastRow&&lastRow.length>3)row=row.concat(lastRow.slice(3));
      rawArr.push(row);lastKey=k;added++;
    }
  }
  return added;
}

function chart(data,signals,filtered,gradeMode){
  if(!data||data.length<2)return"";
  const W=720,HH=280,pt=20,pr=48,pb=28,pl=8,w=W-pl-pr,h=HH-pt-pb;
  const ps=data.map(d=>d.price),mn=Math.min(...ps),mx=Math.max(...ps),r=mx-mn||1;
  const px=i=>pl+(i/(data.length-1))*w,py=p=>pt+h-((p-mn)/r)*h;
  const step=data.length>500?Math.ceil(data.length/500):1;
  let pP="",mP="",f=true;
  for(let i=0;i<data.length;i+=step){const c=f?"M":"L";f=false;pP+=c+px(i)+","+py(data[i].price)+" ";
    const mVal=isBTC()?(data[i].ma200w||data[i].price):(data[i].ma||data[i].price);
    mP+=c+px(i)+","+py(mVal)+" ";}
  const last=data.length-1;pP+="L"+px(last)+","+py(data[last].price);
  let g="";[0,.25,.5,.75,1].forEach(ff=>{const p=mn+r*ff,y=py(p);const l=p>=10000?"$"+(p/1000).toFixed(0)+"k":p>=1000?"$"+(p/1000).toFixed(1)+"k":"$"+p.toFixed(0);g+='<line x1="'+pl+'" y1="'+y+'" x2="'+(pl+w)+'" y2="'+y+'" stroke="rgba(255,255,255,0.04)"/><text x="'+(pl+w+4)+'" y="'+(y+3)+'" fill="rgba(255,255,255,0.2)" font-size="8">'+l+'</text>';});
  const ds=Math.max(1,Math.floor(data.length/8));let dl="";
  for(let i=0;i<data.length;i+=ds){const d=new Date(data[i].date);dl+='<text x="'+px(i)+'" y="'+(pt+h+15)+'" fill="rgba(255,255,255,0.2)" font-size="7" text-anchor="middle">'+d.getFullYear()+'.'+(d.getMonth()+1)+'</text>';}
  let fs="";filtered.forEach(s=>{const x=px(s.idx),y=py(s.price);if(gradeMode){fs+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="#ff9628" stroke="#0a0f1a" stroke-width="1.5" opacity="0.9"/>';return;}fs+='<line x1="'+(x-4)+'" y1="'+(y-4)+'" x2="'+(x+4)+'" y2="'+(y+4)+'" stroke="#ff2d55" stroke-width="2" opacity="0.4"/><line x1="'+(x+4)+'" y1="'+(y-4)+'" x2="'+(x-4)+'" y2="'+(y+4)+'" stroke="#ff2d55" stroke-width="2" opacity="0.4"/>';});
  let ts="";signals.forEach((s,si)=>{const x=px(s.idx),y=py(s.price);ts+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="#00e5a0" stroke="#0a0f1a" stroke-width="2"/><text x="'+x+'" y="'+(pt+8)+'" fill="#00e5a0" font-size="7" font-weight="700" text-anchor="middle">'+(si+1)+'</text>';});
  const maColor=isBTC()?'rgba(247,147,26,0.3)':'rgba(255,120,73,0.3)';
  const maLabel=isBTC()?'200周线':'均线';
  return '<svg width="'+W+'" height="'+HH+'" style="display:block;max-width:100%">'+g+dl+'<path d="'+pP+'" fill="none" stroke="rgba(100,140,255,0.6)" stroke-width="1.5"/><path d="'+mP+'" fill="none" stroke="'+maColor+'" stroke-width="1" stroke-dasharray="4,4"/>'+fs+ts+'</svg>';
}

function ap(){
  const v=id=>{const el=document.getElementById(id);return el?parseFloat(el.value):NaN;};
  if(isBTC()){
    const r=v("p_rsi"),d=v("p_d"),c=v("p_c"),a=v("p_ahr");
    if(!isNaN(r))rp_btc.rsi=Math.round(r);
    if(!isNaN(d))rp_btc.dd=Math.round(d);
    if(!isNaN(c))rp_btc.cool=Math.round(c);
    if(!isNaN(a)&&a>0&&a<2)rp_btc.ahr999=Math.round(a*100)/100;
  } else {
    const s=v("p_s"),d=v("p_d"),c=v("p_c"),m=v("p_m"),vx=v("p_v"),ov=v("p_o");
    if(!isNaN(vx)&&vx>0)rp_stock.vix=Math.round(vx*10)/10;
    if(!isNaN(ov)&&ov>=0)rp_stock.override=Math.round(ov*10)/10;
    if(!isNaN(s))rp_stock.sent=Math.round(s);
    if(!isNaN(d))rp_stock.dd=Math.round(d);
    if(!isNaN(c))rp_stock.cool=Math.round(c);
    if(!isNaN(m))rp_stock.ma=Math.round(m);
  }
  saveParams();  // 改完立刻存到浏览器
  run();
}

function render(){
  document.getElementById("tabs").innerHTML=["SPY","QQQ","BTC"].map(a=>{
    const cls=asset===a?"on":"";
    const extra=a==='BTC'&&asset==='BTC'?' btc':'';
    return '<button class="ab '+cls+extra+'" data-action="tab" data-asset="'+a+'">'+a+'</button>';
  }).join("");
  run();
}

document.addEventListener("keydown",function(e){if(e.key==="Enter")ap();});

// EVENT DELEGATION — no inline onclick, works in sandboxed webviews
// ════════════════════════════════════════
function handleAction(actionEl){
  if(!actionEl)return;
  var action=actionEl.getAttribute("data-action");
  if(!action)return;
  if(action==="refresh"){doRefresh();}
  else if(action==="scan"){ap();}
  else if(action==="apply"){applyToExec();}
  else if(action==="tab"){
    var a=actionEl.getAttribute("data-asset");
    if(a){asset=a;syncCurrentParams();render();}
  }
  else if(action==="toggle-stock-lock"){rp_stock.lock=rp_stock.lock==='week'?'day':'week';saveParams();run();renderExecBar();}
  else if(action==="toggle-stock-recov"){rp_stock.recov=!rp_stock.recov;saveParams();run();renderExecBar();}
  else if(action==="toggle-stock-grade"){rp_stock.grade=!rp_stock.grade;saveParams();run();renderExecBar();}
  else if(action==="toggle-stock-trig"){rp_stock.trig=rp_stock.trig==='vix'?'sent':'vix';saveParams();run();renderExecBar();}
  else if(action==="toggle-stock-ma"){rp_stock.useMA=!rp_stock.useMA;saveParams();run();renderExecBar();}
  else if(action==="toggle-stock-econ"){rp_stock.useEcon=!rp_stock.useEcon;saveParams();run();renderExecBar();}
  else if(action==="toggle-btc-ma"){rp_btc.ma200w=!rp_btc.ma200w;saveParams();run();renderExecBar();}
  else if(action==="reset-params"){resetParams();}
}

// Click for desktop
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-action]");
  if(el)handleAction(el);
});

// Touch for mobile — use touchend to avoid double-fire
var touchMoved=false;
document.addEventListener("touchstart",function(){touchMoved=false;},{passive:true});
document.addEventListener("touchmove",function(){touchMoved=true;},{passive:true});
document.addEventListener("touchend",function(e){
  if(touchMoved)return;
  var el=e.target.closest("[data-action]");
  if(el){e.preventDefault();handleAction(el);}
});

function startAutoRefresh(){
  if(autoTimer)clearInterval(autoTimer);
  autoTimer=setInterval(doRefresh, 5*60*1000);
}
setTimeout(function(){doRefresh();startAutoRefresh();}, 300);
